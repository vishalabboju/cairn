version: "3.9"
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=${JWT_SECRET:-change-me-min-32-chars-in-production-please}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change-me-refresh-min-32-chars-please}
    volumes:
      - ./prisma:/app/prisma
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: cairn
      POSTGRES_DB: cairn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    profiles: ["postgres"]
volumes:
  pgdata:
